<head>

</head>
<body class="mon-body">
<a class="skip-link" href="#main">Skip to content</a>
<div class="mon-page">
  <header class="mon-header">
    <a href="dashboard.html" class="mark" aria-label="Home"></a>
    <div><h1>Event-day monitor</h1><small>Helm Events</small></div>
    <nav class="nav"><a href="dashboard.html">Home</a><a href="calendar.html?cv=live">Live today</a></nav>
    <span class="spacer"></span>
    <span id="bell"></span>
    <span id="account" class="account" hidden></span>
  </header>
  <main id="main" class="mon">
    <!-- R255: the wall screen's own bar, always on top: the way out, the event -->
    <div class="tc mon-wallbar" id="monWallBar" role="region" aria-label="Wall screen" hidden>
      <b class="mon-wallbar-t">Wall screen</b>
      <a class="tc-btn" id="monWallBack" href="dashboard.html" hidden>Back to event</a>
      <button type="button" class="tc-btn tc-primary" id="monWallX"><span aria-hidden="true">✕</span> Exit full screen</button>
    </div>
    <div id="monBoot" class="mon-card mon-loading" aria-busy="true">Loading the event day…</div>
    <div id="monErr" class="mon-card mon-err" role="alert" hidden></div>

    <div id="monApp" class="tc mon-app" hidden>
      <!-- R252 (pre-check.js): red, pinned - Ready by has passed and pre-event is not marked complete -->
      <section class="pc-top" id="monPreTop" hidden></section>
      <!-- R194: one header band, the same component as Tasks & Crew (ops-board.css .tc-ev): event switcher as the title,
           date / time / venue / guests, the countdown tile, then the actions -->
      <section class="tc-ev tc-card mon-ev" aria-labelledby="monTitle">
        <div class="tc-ev-main mon-ev-main">
          <div class="tc-ev-id"><span class="tc-ev-code" id="monCode"></span><span class="tc-pill" id="monPill" hidden></span></div>
          <div class="mon-evpick">
            <h2 id="monTitle" class="tc-ev-title mon-title">Event day</h2>
            <span class="mon-evpick-chev" aria-hidden="true"></span>
            <label class="tc-sr" for="monEvent">Switch event</label>
            <select id="monEvent" class="mon-evpick-sel" aria-describedby="monEventHint"></select>
          </div>
          <span id="monEventHint" class="tc-sr">Today and the next 3 days first, then the rest of the month.</span>
          <p id="monSub" class="tc-ev-sub mon-sub"></p>
        </div>
        <dl class="tc-times mon-times" id="monTimes" aria-label="Times"></dl>
        <div class="tc-ev-foot mon-head-acts">
          <a id="monOpenOps" class="tc-btn tc-primary" href="ops.html">Open Tasks &amp; Crew</a>
          <a id="monBack" class="tc-btn" href="dashboard.html" hidden>Back to event</a>
          <button type="button" id="monRefresh" class="tc-btn" aria-describedby="monUpdated">Refresh</button>
          <span id="monUpdated" class="mon-updated" aria-live="polite"></span>
          <span class="mon-head-r">
            <button type="button" id="monWall" class="tc-btn mon-wallbtn" aria-pressed="false">Wall screen</button>
          </span>
        </div>
      </section>

      <!-- R251: one step strip - Day before / Pre-event / On the event, the same steps (data-win) as Tasks & Crew. The filled dot +
           "Now" marks where the event is (the studio's clock + the quote's stage, task-status.js); the other steps look ahead / back
           and change what the page shows. Wrap-up is no step: a closed section at the very bottom (#monWrapUp). -->
      <nav class="mon-stp" id="monWins" aria-label="Where the event is">
        <ol class="mon-stp-list" id="monStpList">
          <li><button type="button" class="mon-stp-b" data-win="daybefore" aria-pressed="false">Day before<span class="mon-stp-now">Now</span></button></li>
          <li><button type="button" class="mon-stp-b" data-win="pre" aria-pressed="false">Pre-event<span class="mon-stp-now">Now</span></button></li>
          <li><button type="button" class="mon-stp-b" data-win="onday" aria-pressed="false">On the event<span class="mon-stp-now">Now</span></button></li>
        </ol>
        <!-- R252 (pre-check.js): "How the steps work", closed -->
        <div class="pc-how" id="monHow"></div>
      </nav>
      <!-- R257: there is no event-day lock; only a database without 0442 shows its one line here (event-floor.js) -->
      <section class="ef-lock mon-lock" id="monLock" hidden></section>
      <!-- R252 (pre-check.js, the same as Tasks & Crew): the pre-event check, on Pre-event from 1 hour before Ready by until it is marked complete -->
      <section class="pc" id="monPreCheck" hidden></section>
      <!-- R257 (day-before.js, the same as Tasks & Crew): the checklist is the first thing of Day before and Pre-event -->
      <section class="tc-card ep-card mon-list" id="monDayBefore" aria-labelledby="monDayBeforeH" hidden></section>
      <section class="tc-card ep-card mon-list" id="monPreList" aria-labelledby="monPreListH" hidden></section>
      <!-- R253 (event-wrap.js): who has arrived and left, on Pre-event and On the event. R260 (vendor-items.js): their items are checked in here, right under
           the Pre-event checklist; On the event it sits with the issues (monitor.css) -->
      <section class="tc-card mon-mini hwd-card" id="monVendors" hidden></section>

      <!-- R251 / R257: what each step shows, top to bottom. Day before = the checklist, needs action + set-up numbers (closed), Ready by, floor plan.
           Pre-event = the checklist, the live strip, late set-up jobs, Ready by, floor plan, the work, "Mark pre-event complete".
           On the event = the live strip, run-sheet now / next, Late panel, issues, the work + activity, floor plan. -->
      <section id="monSummary" class="mon-summary" aria-label="At a glance"></section>
      <section class="tc-card mon-mini" id="monRun" aria-labelledby="monRunH" hidden></section>
      <!-- R252 (event-delay.js, the same card as Tasks & Crew): "Running late - what it affects" -->
      <section class="dly" id="monDelay" hidden></section>
      <section id="monAlerts" class="mon-alerts" aria-label="Late tasks" role="region" hidden></section>
      <section class="tc-card mon-mini" id="monIssues" aria-labelledby="monIssuesH" hidden></section>
      <!-- R255 (0440, event-extras.js): extra food and anything added that day, on On the event; the same card as Tasks & Crew -->
      <section class="tc-card mon-mini tc-xtra hwd-card" id="monExtras" hidden></section>
      <section class="tc-card mon-prep" id="monPrep" aria-labelledby="monPrepH" hidden></section>
      <section class="tc-card ep-card" id="monReady" aria-labelledby="monReadyH" hidden></section>
      <section class="tc-card ef-card" id="monFloor" aria-labelledby="monFloorH" hidden></section>

      <div class="mon-work" id="monWork">
        <div class="mon-tabs" role="tablist" aria-label="Views" id="monTabs">
          <button type="button" role="tab" class="mon-tab" data-tab="staff" id="monTab-staff" aria-controls="monView">People</button>
          <button type="button" role="tab" class="mon-tab" data-tab="work" id="monTab-work" aria-controls="monView">Work</button>
          <button type="button" role="tab" class="mon-tab" data-tab="checkin" id="monTab-checkin" aria-controls="monView">Check-in</button>
          <button type="button" role="tab" class="mon-tab" data-tab="activity" id="monTab-activity" aria-controls="monView">Activity</button>
        </div>

        <!-- R250: status = filter chips (with counts); search + the menus in one row; on a phone the menus fold behind Filters -->
        <div class="mon-tools" id="monTools" role="search">
          <div class="mon-chips" id="monChips" role="group" aria-label="Show only"></div>
          <label class="tc-search mon-search" for="monQ"><span class="tc-search-ico" aria-hidden="true"></span><input type="search" id="monQ" maxlength="80" placeholder="Search task, person or section" autocomplete="off" aria-label="Search"></label>
          <button type="button" id="monFiltersBtn" class="tc-btn mon-filtersbtn" aria-expanded="false" aria-controls="monFilters">Filters <span class="mon-n" id="monFiltersN"></span></button>
          <div class="mon-filters" id="monFilters">
            <select id="monWho" class="mon-select" aria-label="Person"></select>
            <select id="monSec" class="mon-select" aria-label="Section"></select>
            <select id="monSort" class="mon-select" aria-label="Sort">
              <option value="time">Sort: start time</option>
              <option value="name">Sort: name</option>
              <option value="status">Sort: status</option>
            </select>
            <button type="button" id="monClear" class="tc-btn ghost mon-clear" hidden>Clear</button>
          </div>
        </div>

        <div class="mon-grid">
          <div id="monView" class="mon-view" role="tabpanel" aria-labelledby="monTab-staff" aria-live="polite"></div>
          <aside class="mon-side tc-card" aria-labelledby="monFeedH">
            <div class="mon-side-h"><h3 class="mon-h3" id="monFeedH">Recent activity</h3><button type="button" class="tc-mini-link mon-linkbtn" id="monFeedAll">See all</button></div>
            <ol id="monFeed" class="mon-feed"></ol>
          </aside>
        </div>
      </div>

      <!-- R251 (event-steps.js, the same parts as Tasks & Crew): the end of Pre-event, then Wrap-up - closed until someone opens it -->
      <div class="mon-predone" id="monPreDoneBox" hidden><section class="tc-card" id="monPreDone" hidden></section></div>
      <div class="mon-wrapup"><section class="tc-card" id="monWrapUp" hidden></section></div>
    </div>
  </main>
</div>
<!-- R226: "Open" shows the task here in a drawer (Tasks & Crew stays one link away) -->
<div class="mon-scrim" id="monScrim" hidden></div>
<aside class="mon-drawer tc" id="monDrawer" role="dialog" aria-modal="true" aria-labelledby="monDrawerH" hidden>
  <div class="mon-drawer-h"><h2 id="monDrawerH" class="tc-h2">Task</h2><button type="button" class="tc-btn sm ghost" id="monDrawerX" aria-label="Close">✕</button></div>
  <div class="mon-drawer-b" id="monDrawerB"></div>
</aside>

<script src="/console-warning.js?v=1"></script>

</body>
