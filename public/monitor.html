<!doctype html>
<html lang="en" data-theme="light" class="auth-pending">
<head>
<style id="bp-auth-gate">html.auth-pending body,html.auth-pending body *{visibility:hidden!important}</style>
<meta charset="utf-8">
<base href="/"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event-day monitor — Helm Events</title>
<link rel="preload" href="/vendor/supabase-js-2.119.0.min.js" as="script" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous">
<link rel="stylesheet" href="/fonts/g/ibm-plex-sans-fc5a3390.css">
<link rel="stylesheet" href="theme.css?v=84"><link rel="stylesheet" href="/ui-pickers.css?v=4"><script src="/ui-pickers.js?v=4" defer></script>
<link rel="stylesheet" href="ops-board.css?v=5">
<link rel="stylesheet" href="monitor.css?v=7">
<link rel="stylesheet" href="event-plan.css?v=1">
<link rel="stylesheet" href="event-floor.css?v=1">
<script src="/trusted-types.js?v=9"></script>
<script src="/shell-proto.js?v=103" id="shellProto"></script>
</head>
<body class="mon-body">
<a class="skip-link" href="#main">Skip to content</a>
<div class="mon-page">
  <header class="mon-header">
    <a href="dashboard.html" class="mark" title="Home"></a>
    <div><h1>Event-day monitor</h1><small>Helm Events</small></div>
    <nav class="nav"><a href="dashboard.html">Home</a><a href="calendar.html?cv=live">Live today</a></nav>
    <span class="spacer"></span>
    <span id="bell"></span>
    <span id="account" class="account" hidden></span>
  </header>
  <main id="main" class="mon">
    <div id="monBoot" class="mon-card mon-loading" aria-busy="true">Loading the event day…</div>
    <div id="monErr" class="mon-card mon-err" role="alert" hidden></div>

    <div id="monApp" class="tc mon-app" hidden>
      <!-- R194: one header band, the same component as Tasks & Crew (ops-board.css .tc-ev): event switcher as the title,
           date / time / venue / guests, the countdown tile, then the actions -->
      <section class="tc-ev tc-card mon-ev" aria-labelledby="monTitle">
        <div class="tc-ev-main mon-ev-main">
          <div class="tc-ev-id"><span class="tc-ev-code" id="monCode"></span><span class="tc-pill" id="monPill" hidden></span></div>
          <div class="mon-evpick">
            <h2 id="monTitle" class="tc-ev-title mon-title">Event day</h2>
            <span class="mon-evpick-chev" aria-hidden="true"></span>
            <label class="tc-sr" for="monEvent">Switch event</label>
            <select id="monEvent" class="mon-evpick-sel" aria-describedby="monEventHint" title="Switch event"></select>
          </div>
          <span id="monEventHint" class="tc-sr">Today and the next 3 days first, then the rest of the month.</span>
          <p id="monSub" class="tc-ev-sub mon-sub"></p>
        </div>
        <dl class="tc-times mon-times" id="monTimes" aria-label="Times"></dl>
        <div class="tc-ev-foot mon-head-acts">
          <a id="monOpenOps" class="tc-btn tc-primary" href="ops.html">Open Tasks &amp; Crew</a>
          <button type="button" id="monRefresh" class="tc-btn" aria-describedby="monUpdated">Refresh</button>
          <span id="monUpdated" class="mon-updated" aria-live="polite"></span>
          <button type="button" id="monWall" class="tc-btn ghost mon-wallbtn" aria-pressed="false" title="Big text for a wall screen or TV (full screen)">Wall screen</button>
        </div>
      </section>

      <!-- R226 (EVENT-OPS-PLAN-V2.md): the SAME four windows as Tasks & Crew, picked from the studio's clock (task-status.js) -->
      <div class="tc-phase-row ep-wins" id="monWins">
        <div class="tc-seggrp" role="group" aria-label="Which part of the job">
          <button type="button" class="tc-seg" data-win="before" aria-pressed="false">Before the event</button>
          <button type="button" class="tc-seg" data-win="daybefore" aria-pressed="false">Day before</button>
          <button type="button" class="tc-seg" data-win="onday" aria-pressed="false">On the day</button>
          <button type="button" class="tc-seg" data-win="wrapup" aria-pressed="false">Wrap-up</button>
        </div>
        <span class="ep-wnote" id="monWinNote" aria-live="polite"></span>
        <button type="button" class="tc-btn sm ghost" id="monWinAuto" hidden>Use the studio’s clock</button>
      </div>
      <!-- R227 (0397, event-floor.js): the plan lock bar + the floor plan for the day; hidden before 0397 -->
      <section class="ef-lock" id="monLock" hidden></section>
      <section class="tc-card ep-card" id="monDayBefore" aria-labelledby="monDayBeforeH" hidden></section>
      <section class="tc-card ep-card" id="monReady" aria-labelledby="monReadyH" hidden></section>
      <section class="tc-card ef-card" id="monFloor" aria-labelledby="monFloorH" hidden></section>
      <section class="tc-card ep-card mon-wrapcard" id="monWrap" aria-label="Wrap-up" hidden></section>

      <section id="monSummary" class="mon-summary" aria-label="Progress"></section>
      <section id="monAlerts" class="mon-alerts" aria-label="Late tasks" role="region" hidden></section>

      <div class="mon-tabs" role="tablist" aria-label="Views" id="monTabs">
        <button type="button" role="tab" class="mon-tab" data-tab="staff" id="monTab-staff" aria-controls="monView">By staff</button>
        <button type="button" role="tab" class="mon-tab" data-tab="work" id="monTab-work" aria-controls="monView">By work</button>
        <button type="button" role="tab" class="mon-tab" data-tab="status" id="monTab-status" aria-controls="monView">By status</button>
        <button type="button" role="tab" class="mon-tab" data-tab="left" id="monTab-left" aria-controls="monView">Leftover <span class="mon-n" id="monLeftN"></span></button>
        <button type="button" role="tab" class="mon-tab" data-tab="checkin" id="monTab-checkin" aria-controls="monView">Check-in</button>
        <button type="button" role="tab" class="mon-tab" data-tab="activity" id="monTab-activity" aria-controls="monView">Activity</button>
      </div>

      <!-- R194: filters in one row (search + four small menus); on a phone the menus fold behind a Filters button -->
      <div class="mon-tools" id="monTools" role="search">
        <label class="tc-search mon-search" for="monQ"><span class="tc-search-ico" aria-hidden="true"></span><input type="search" id="monQ" maxlength="80" placeholder="Search task, person or section" autocomplete="off" aria-label="Search"></label>
        <button type="button" id="monFiltersBtn" class="tc-btn mon-filtersbtn" aria-expanded="false" aria-controls="monFilters">Filters <span class="mon-n" id="monFiltersN"></span></button>
        <div class="mon-filters" id="monFilters">
          <select id="monWho" class="mon-select" aria-label="Person"></select>
          <select id="monSec" class="mon-select" aria-label="Section"></select>
          <select id="monSt" class="mon-select" aria-label="Status">
            <option value="">Any status</option>
            <option value="late">Late</option>
            <option value="waiting">Waiting for a yes</option>
            <option value="accepted">Accepted</option>
            <option value="started">Started</option>
            <option value="done">Done</option>
            <option value="rejected">Turned down</option>
            <option value="unassigned">No one yet</option>
          </select>
          <select id="monSort" class="mon-select" aria-label="Sort">
            <option value="time">Sort: start time</option>
            <option value="name">Sort: name</option>
            <option value="status">Sort: status</option>
          </select>
          <button type="button" id="monClear" class="tc-btn ghost mon-clear" hidden>Clear</button>
        </div>
      </div>

      <div class="mon-grid">
        <div id="monView" class="mon-view" role="tabpanel" aria-labelledby="monTab-staff" aria-live="polite"></div>
        <aside class="mon-side tc-card" aria-labelledby="monFeedH">
          <div class="mon-side-h"><h3 class="mon-h3" id="monFeedH">Recent activity</h3><button type="button" class="tc-mini-link mon-linkbtn" id="monFeedAll">See all</button></div>
          <ol id="monFeed" class="mon-feed"></ol>
        </aside>
      </div>
    </div>
  </main>
</div>
<!-- R226: "Open" shows the task here in a drawer (Tasks & Crew stays one link away) -->
<div class="mon-scrim" id="monScrim" hidden></div>
<aside class="mon-drawer tc" id="monDrawer" role="dialog" aria-modal="true" aria-labelledby="monDrawerH" hidden>
  <div class="mon-drawer-h"><h2 id="monDrawerH" class="tc-h2">Task</h2><button type="button" class="tc-btn sm ghost" id="monDrawerX" aria-label="Close">✕</button></div>
  <div class="mon-drawer-b" id="monDrawerB"></div>
</aside>

<script src="/console-warning.js?v=1"></script>
<script src="telemetry.js?v=12"></script>
<script src="config.js?v=113"></script>
<script src="event-name.js?v=9"></script>
<script src="country-profile.js?v=7"></script><script src="store-api.js?v=389"></script>
<script src="live-board.js?v=2"></script>
<script src="task-status.js?v=3"></script>
<script src="event-plan.js?v=2"></script>
<script src="monitor.js?v=10"></script>
<script src="event-floor.js?v=1"></script>
</body>
</html>
