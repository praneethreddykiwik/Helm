name: E2E (Playwright, staging — gated)
# Playwright E2E tests that talk to the STAGING deployment.
#
# These tests are GATED on repository secrets being present. For external
# contributors and forked PRs (where secrets are never exposed) the job detects
# the missing secrets and exits cleanly WITHOUT failing — E2E is opt-in, never a
# barrier to a normal contribution.
#
# OWNER ACTION — to actually run these tests, add the following secrets under
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#     HELM_E2E_STAGING_URL     staging Supabase URL / app base URL
#     HELM_E2E_STAGING_ANON    staging anon key
#     HELM_E2E_EMAIL           a seeded staging test-user email
#     HELM_E2E_PASSWORD        that user's password
#   (These must point ONLY at the staging project — never production.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    name: E2E gate (did the suite actually run?)
    # Publishes whether the required secrets exist. Secrets cannot be referenced
    # in job-level `if:`, so we surface presence as an output here.
    #
    # VISIBILITY: a green tick on this gate does NOT mean E2E passed — it only
    # means the gate ran. When secrets are absent the gate emits a ::warning::
    # annotation and a job summary so the skip is legible in the PR Checks UI,
    # instead of being buried in this step's log behind a success tick.
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.HELM_E2E_STAGING_URL }}" ] \
             && [ -n "${{ secrets.HELM_E2E_STAGING_ANON }}" ] \
             && [ -n "${{ secrets.HELM_E2E_EMAIL }}" ] \
             && [ -n "${{ secrets.HELM_E2E_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E will run::E2E secrets present — the Playwright suite will execute."
            {
              echo "### E2E (Playwright, staging)"
              echo ""
              echo "✅ **Secrets present — the Playwright E2E suite will run.** See the \`e2e\` job for results."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E SKIPPED — not run::E2E secrets are not configured, so the Playwright suite was SKIPPED (it did NOT run and did NOT pass). This is expected for forks/external PRs. Owner: add the HELM_E2E_* repository secrets to enable it."
            {
              echo "### E2E (Playwright, staging) — ⚠️ SKIPPED, did NOT run"
              echo ""
              echo "The Playwright E2E suite was **skipped** because the \`HELM_E2E_*\` secrets are not configured."
              echo ""
              echo "- A green tick on this gate means only that the gate ran — **not** that E2E passed."
              echo "- The \`e2e\` job below shows as *skipped* (it did not execute)."
              echo "- Expected for forks/external PRs; secrets are never exposed to them."
              echo ""
              echo "**Owner action:** add \`HELM_E2E_STAGING_URL\`, \`HELM_E2E_STAGING_ANON\`, \`HELM_E2E_EMAIL\`, \`HELM_E2E_PASSWORD\` under Settings → Secrets and variables → Actions to run this suite."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # audit run-3 ci/workflows/pull_request-jobs-expose-test-secrets-without-environment:
    # this job hands staging/test secrets to code from the PR checkout, so it is
    # bound to the 'staging-tests' GitHub Environment. OWNER ACTION: Settings ->
    # Environments -> staging-tests -> add yourself as a Required reviewer (and,
    # optionally, move the HELM_TEST_* / HELM_E2E_* secrets into that environment).
    # Until a reviewer rule exists GitHub creates the environment with no gate, so
    # behaviour is unchanged; once it exists, every run waits for approval.
    environment: staging-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc   # R51: exact Node pin lives in .nvmrc (22.23.4)
      - name: Install dev dependencies (Playwright test runner)
        run: npm ci --ignore-scripts   # r30: no lifecycle scripts (npm worm defence; no dependency needs one)
      - name: Verify npm registry signatures / provenance (r30)
        run: npm audit signatures
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright E2E (staging, trace off)
        run: npx playwright test --trace off
        env:
          CI: 'true'
          HELM_E2E_STAGING_URL: ${{ secrets.HELM_E2E_STAGING_URL }}
          HELM_E2E_STAGING_ANON: ${{ secrets.HELM_E2E_STAGING_ANON }}
          HELM_E2E_EMAIL: ${{ secrets.HELM_E2E_EMAIL }}
          HELM_E2E_PASSWORD: ${{ secrets.HELM_E2E_PASSWORD }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
