name: CI
on:
  push:
    branches: [main, 'harden/**']
  pull_request:
permissions:
  contents: read
  # private repo: the gitleaks action lists the PR's commits through the API (403 without this)
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # full history so the secret scan can inspect all commits
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc   # R51: exact Node pin lives in .nvmrc (22.23.4)
      - name: Secret scan (gitleaks) — fail on any committed credential
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: JWT roles — no service_role / non-anon JWT in any tracked file
        run: node scripts/check-jwt-roles.mjs
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high
      - name: GitHub Actions pinned to full commit SHAs
        run: node scripts/check-actions-pinned.mjs
      - name: Run zero-dependency checks
        run: node scripts/ci-check.mjs
      - name: HTML-sink guard (no unescaped innerHTML / insertAdjacentHTML / document.write)
        run: node scripts/check-html-sinks.mjs
      - name: No new inline styles (CSP style-src stays hash/class based)
        run: node scripts/extract-inline-styles.mjs --check
      - name: Base functions immutable (rename-and-wrap only)
        run: node scripts/check-base-immutable.mjs
      - name: Capture-host config current
        run: node scripts/gen-capture-host.mjs --check
      - name: Deployment containment (static-only) assertions
        run: node scripts/check-deploy-static.mjs
      - name: Install pinned build tools (tools/build lockfile, no install scripts)
        run: npm ci --prefix tools/build --ignore-scripts --no-audit --no-fund
      - name: Minified build (R131) - every file parses, no source maps
        run: node scripts/build-dist.mjs --check
      - name: Migration-canon consistency guard (repo-only, no DB)
        run: node scripts/check-migration-canon.mjs
      - name: OTP-safety guard (no hardcoded PIN, repo-only)
        run: node scripts/check-otp-safety.mjs
      - name: Deferred integrations stay disabled (Razorpay/WhatsApp)
        run: node scripts/check-deferred-integrations.mjs
      - name: Environment-separation guard (no silent prod from localhost)
        run: node scripts/check-env-safety.mjs
      # R116: PR #357 changed store-api.js but kept every ?v=324, so browsers kept a year-cached (immutable)
      # old file. Fail any PR whose changed public/ js|css still has a ?v= (or loader constant / SHELL_V)
      # no higher than the PR base had. PR-only: on main itself there is no base diff to judge.
      - name: Cache-bust guard (changed assets must bump their ?v=)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"   # checkout already uses fetch-depth: 0
          node scripts/bump-changed-assets.mjs --check --base "origin/${BASE_REF}"
      - name: CSP inline-script hashes current (no 'unsafe-inline')
        run: node scripts/gen-csp.mjs --check
      - name: Regression tests (source characterization, no DB)
        run: npm test
      - name: Local dev preserved (server.js /api/health 200)
        run: node scripts/check-local-api.mjs
      # Optional: verify a live preview/prod URL blocks /api (set DEPLOY_CHECK_URL in repo/CI vars)
      - name: Deployed /api containment (only if DEPLOY_CHECK_URL set)
        if: env.DEPLOY_CHECK_URL != ''
        run: node scripts/check-deploy-static.mjs
        env:
          DEPLOY_CHECK_URL: ${{ vars.DEPLOY_CHECK_URL }}

  # R145: the Deno edge-function suite (tests/edge, mocks only). Supabase and every provider (Meta, Resend, MSG91,
  # Razorpay, Turnstile) are stubbed in-process; the test run gets NO --allow-net, so a real call fails the run.
  # No secrets. Only the locked test helpers (deno.land/std, jsr @std/assert) are downloaded, checked against deno.lock.
  edge-tests:
    runs-on: ubuntu-24.04          # pinned like the DB jobs (R136b: ubuntu-latest 26.04 DNS failures)
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NO_COLOR: '1'
      # npm packages are never resolved here (supabase-js -> tests/edge/mocks); keeps deno.lock independent of package.json
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
          cache: true               # DENO_DIR cached, keyed on deno.lock
      - name: Fetch locked test dependencies (frozen deno.lock)
        run: deno cache --lock=deno.lock --frozen --import-map=tests/edge/import_map.json tests/edge/*.test.ts supabase/functions/_shared/smtp_test.ts
      - name: Edge-function tests (tests/edge) - no network permission, cached dependencies only
        working-directory: tests/edge
        run: deno test --lock=../../deno.lock --frozen --cached-only --allow-env --allow-read --no-check --import-map=import_map.json
      - name: SMTP client test (fake server on 127.0.0.1 only)
        run: deno test --lock=deno.lock --frozen --cached-only --allow-net=127.0.0.1 --allow-env --allow-read --no-check supabase/functions/_shared/smtp_test.ts
