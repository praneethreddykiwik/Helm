name: DB canonical (PostgreSQL 17)
# ============================================================================
# Gates the canonical migration path + DB behavioral suites on a real PG17.
# Runs: fresh canonical install, second/idempotent install, pricing parity,
# auth matrix, tenant-attack matrix, G4 coverage, grants matrix, and the genuine
# two-session concurrency test. Local-only semantics — never touches staging/prod.
# ============================================================================
on:
  push:
    branches: [main, 'harden/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-canonical:
    # R136b: pinned - since ~10 Nov 2026 ubuntu-latest (26.04 image) cannot reach the Ubuntu apt mirrors
    # ("Temporary failure resolving archive.ubuntu.com"), so the psql install failed on every run.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }   # R51: exact Node pin lives in .nvmrc (22.23.4)
      - name: Install psql client
        run: |
          # use the runner's own psql when present; otherwise install with retries (mirror hiccups)
          if command -v psql >/dev/null && command -v createdb >/dev/null; then psql --version; exit 0; fi
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y postgresql-client && break
            echo "apt attempt $i failed - retrying in 15s"; sleep 15
          done
          psql --version
      - name: npm ci
        run: npm ci --ignore-scripts   # r30: no lifecycle scripts (npm worm defence; no dependency needs one)
      - name: Verify npm registry signatures / provenance (r30)
        run: npm audit signatures
      - name: Run canonical DB suite (fresh install + idempotent + behavioral)
        run: npm run test:db
